# Default run config. Validated by configs/config.py::load_config against RunConfig,
# which is also where the defaults and the allowed ranges live. Unknown keys are an
# error, not a no-op, so a typo here fails at startup.
#
#   from configs.config import load_config
#   cfg = load_config()

env:
  character: IRONCLAD
  seed: 42
  ascension: 0
  # The engine can see the draw pile's order; a player cannot. Leave false so the
  # policy is not trained on information it will not have at inference.
  reveal_draw_pile: false

rollout:
  episodes: 1
  max_steps: 2000
  max_battles: null        # null = no cap, play the run out
  out_dir: data/rollouts
  log_observations: true

policy:
  kind: random             # 'random' until agent/policy.py has an LLM behind it
  model: claude-opus-5
  temperature: 1.0
  max_tokens: 1024

training:
  algorithm: sft
  learning_rate: 1.0e-5
  batch_size: 8
  epochs: 1
  output_dir: training/runs
